<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus Sites</title>
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meus Sites">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<script>
/* ============================================================
   SUA LISTA DE SITES
   Para adicionar um site, copie uma linha e troque os dados.
   - nome:  o que aparece embaixo do ícone
   - url:   o endereço completo (com https://)
   - grupo: opcional, agrupa os ícones em seções
   - icone: opcional, iniciais ou um emoji (vazio = iniciais do nome)
   - cor:   opcional, ex.: "#2b59c3" (vazio = cor automática)
   ============================================================ */
const SITES = [
  // { nome: "Exemplo", url: "https://exemplo.com.br", grupo: "Trabalho", icone: "", cor: "" },
  { nome: "Cesta Básica",                    url: "https://cestabasica.invbotafogo.com.br",  grupo: "INVB",   icone: "🧺", cor: "#0f8a6c" },
  { nome: "NVB Chat",                        url: "https://chat.invbotafogo.com.br",         grupo: "INVB",   icone: "💬", cor: "#2b59c3" },
  { nome: "Café da Manhã — Consagração",     url: "https://consagracao.invbotafogo.com.br",  grupo: "INVB",   icone: "☕", cor: "#c2572f" },
  { nome: "Escala INVB",                     url: "https://escala.invbotafogo.com.br",       grupo: "INVB",   icone: "📅", cor: "#8a3fb8" },
  { nome: "Evangelismo & Integração",        url: "https://escala2.invbotafogo.com.br",      grupo: "INVB",   icone: "🤝", cor: "#b8860b" },
  { nome: "Disponibilidades do Evangelismo", url: "https://evangelismo.invbotafogo.com.br",  grupo: "INVB",   icone: "🗓️", cor: "#2f7fa3" },
  { nome: "Banco de Músicas do Lyra",        url: "https://database.invbotafogo.com.br",     grupo: "INVB",   icone: "🎵", cor: "#c23a6b" },
  { nome: "EBD chamada",                     url: "https://allanbfr77.github.io/ebd-chamada/", grupo: "Ensino", icone: "✅", cor: "#0f8a6c" },
  { nome: "Estudo bíblico",                  url: "https://allanbfr77.github.io/bible-study/", grupo: "Ensino", icone: "📖", cor: "#2b59c3" },
  { nome: "Aula EBI",                        url: "https://allanbfr77.github.io/aula-ebi/",    grupo: "Ensino", icone: "🧒", cor: "#c2572f" },
];
</script>
<style>
:root {
  --bg: #f3f5f9; --surface: #ffffff; --fg: #172033; --muted: #5b667d; --line: #dde2ec; --accent: #2b59c3;
  --shadow: 0 1px 2px rgba(23,32,51,.08), 0 4px 12px rgba(23,32,51,.08);
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f141f; --surface: #182031; --fg: #e6eaf3; --muted: #97a2ba; --line: #2a3448; --accent: #7d9cf0;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.3); color-scheme: dark } }
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
.wrap { max-width: 1000px; margin: 0 auto; padding-block: 22px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px }
h1 { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; margin: 0; letter-spacing: -.01em; flex: 1 1 auto }
.search { flex: 1 1 260px; max-width: 360px; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font: inherit; font-size: 16px }
.search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.group { display: flex; flex-direction: column; gap: 12px }
.group h2 { font-family: var(--f-display); font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0; font-weight: 600 }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 20px 10px }
.tile { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 4px 2px; text-decoration: none; color: var(--fg);
  text-align: center; min-width: 0; -webkit-tap-highlight-color: transparent; border-radius: 12px }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.icon { width: 62px; height: 62px; border-radius: 17px; display: grid; place-items: center; font-family: var(--f-display);
  font-weight: 700; font-size: 1.4rem; color: #fff; box-shadow: var(--shadow); transition: transform .1s }
.icon.emoji { font-size: 2rem }
.tile:active .icon { transform: scale(.92) }
@media (hover: hover) { .tile:hover .icon { transform: translateY(-2px) } }
.name { font-size: .8rem; font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 32px 20px; text-align: center; color: var(--muted) }
@media (max-width: 600px) { .search { max-width: none; flex-basis: 100% } h1 { font-size: 1.4rem } .grid { grid-template-columns: repeat(4, minmax(0,1fr)) } }
@media (max-width: 340px) { .grid { grid-template-columns: repeat(3, minmax(0,1fr)) } }
@media (prefers-reduced-motion: reduce) { .icon { transition: none } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Meus Sites</h1>
    <input id="q" class="search" type="search" placeholder="Buscar site" aria-label="Buscar site" autocomplete="off">
  </header>
  <main id="list"></main>
</div>
<script>
const COLORS = ["#2b59c3","#0f8a6c","#c2572f","#8a3fb8","#b8860b","#c23a6b","#2f7fa3","#4b5563"];
function hashColor(s){ let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; }
function initials(n){ const w=n.trim().split(/\s+/).filter(Boolean); return ((w[0]||"?")[0]+(w[1]?w[1][0]:"")).toUpperCase(); }
function fixUrl(u){ u=(u||"").trim(); return /^https?:\/\//i.test(u) ? u : "https://"+u; }
const sites = SITES.filter(s => s && s.nome && s.url).map(s => ({...s, url: fixUrl(s.url)}));
function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = document.getElementById("list"); list.replaceChildren();
  if (!sites.length){ const e=document.createElement("div"); e.className="empty"; e.textContent="Nenhum site cadastrado ainda. Adicione na lista SITES do arquivo index.html."; list.append(e); return; }
  const shown = sites.filter(s => !q || (s.nome+" "+s.url+" "+(s.grupo||"")).toLowerCase().includes(q));
  if (!shown.length){ const e=document.createElement("div"); e.className="empty"; e.textContent="Nenhum site encontrado."; list.append(e); return; }
  const groups = new Map();
  for (const s of shown){ const g=(s.grupo||"").trim(); if(!groups.has(g)) groups.set(g,[]); groups.get(g).push(s); }
  const names=[...groups.keys()].sort((a,b)=> !a?1:!b?-1:a.localeCompare(b,"pt-BR"));
  const wrap=document.createElement("div"); wrap.style.cssText="display:flex;flex-direction:column;gap:26px";
  for (const g of names){
    const sec=document.createElement("section"); sec.className="group";
    if (names.length>1 || g){ const h=document.createElement("h2"); h.textContent=g||"Outros"; sec.append(h); }
    const grid=document.createElement("div"); grid.className="grid";
    for (const s of groups.get(g).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"))){
      const a=document.createElement("a"); a.className="tile"; a.href=s.url; a.rel="noopener"; a.title=s.url;
      const i=document.createElement("div"); i.className="icon";
      const t=(s.icone||"").trim()||initials(s.nome);
      if (/\p{Extended_Pictographic}/u.test(t)) i.classList.add("emoji");
      i.textContent=t; i.style.background=s.cor||hashColor(s.nome);
      const n=document.createElement("div"); n.className="name"; n.textContent=s.nome;
      a.append(i,n); grid.append(a);
    }
    sec.append(grid); wrap.append(sec);
  }
  list.append(wrap);
}
document.getElementById("q").addEventListener("input", render);
render();
</script>
</body>
</html>
